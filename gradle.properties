# Projektweite Gradle-Einstellungen fuer DropSync.
# JVM-Einstellungen fuer den Gradle-Daemon.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC

# Kein org.gradle.java.home hier: ein Windows-Pfad bricht die Linux-CI
# (Gradle bricht mit "Java home supplied is invalid" ab). Wer unter Windows
# ein JDK ohne Leerzeichen im Pfad braucht -- Gradle 9.5 quotet die
# Test-Executor-Kommandozeile nicht, mit "C:\Program Files\..." schlaegt jeder
# Unit-Test mit "Hauptklasse Files konnte nicht gefunden werden" fehl --, setzt
# das maschinenlokal in ~/.gradle/gradle.properties. Siehe README, Abschnitt
# Build. Auf der CI liefert actions/setup-java das JDK per JAVA_HOME.

# AndroidX ist verbindlich; Jetifier wird nicht benoetigt, weil keine
# Legacy-Support-Bibliotheken verwendet werden.
android.useAndroidX=true

# Buildzeit: Konfigurations- und Build-Cache.
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true

# Kotlin-Codestil ist offiziell, nicht IDE-abhaengig.
kotlin.code.style=official

# Nur benoetigte Ressourcen der deklarierten Sprachen (de, en) paketieren.
android.nonTransitiveRClass=true

# FFmpeg-Decoder-Extension (Plan Phase 3, ADR-0006): standardmaessig aus,
# damit der Standardbuild ohne natives NDK-Artefakt laeuft und auf die
# Plattformdecoder zurueckfaellt. Erst auf true setzen, wenn das Modul
# libs/media3-ffmpeg/ mit dem selbstgebauten Artefakt vorliegt (Anleitung:
# docs/ffmpeg-build.md, Skript: scripts/build-ffmpeg.sh). Dann bindet
# :data:audio die Extension automatisch ein und settings.gradle.kts
# registriert das Modul.
dropsync.enableFfmpeg=false
