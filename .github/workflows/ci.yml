name: CI

# Setzt die Phase-0-Vorgabe aus docs/design/FLOWREP_DROPSYNC_FUSION_DESIGN_2026-08-07.md
# um: "CI: ./gradlew test + spotlessCheck + assembleDebug muss gruen." Reihenfolge
# der Gates entspricht der Build-Sektion im README.

on:
  push:
    branches: [master, "fusion/**"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, Spotless, Assemble
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # :training-core ist ein Submodule (CONTEXT E3). Ohne diesen Schalter
          # ist das Verzeichnis leer und settings.gradle.kts bricht ab.
          submodules: recursive

      # D6 (I-9): Der Gradle-Wrapper-Jar wird gegen die offizielle
      # Pruefsummenliste validiert, bevor irgendetwas gebaut wird.
      - name: Gradle-Wrapper validieren
        uses: gradle/actions/wrapper-validation@v4

      - name: JDK 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: gradlew ausfuehrbar machen
        run: chmod +x ./gradlew

      - name: Gradle einrichten (Cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Benoetigte Android-SDK-Pakete sicherstellen
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort -r | head -n1)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          # Paketname ist "platforms;android-37.0", nicht "...;android-37" --
          # seit API 36 tragen die Platform-Pakete eine Minor-Version. Ohne den
          # Punkt meldet sdkmanager nur "Failed to find package" (Warning) und
          # bricht mit Exit-Code 1 ab; die CI war seit Einfuehrung dieses
          # Schritts durchgaengig rot.
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"

      # Reihenfolge bewusst wie im README (Build-Abschnitt): Screenshot-Gate,
      # dann test, dann spotlessCheck, dann assembleDebug. Bricht beim ersten
      # roten Gate ab.
      #
      # A7/I-1: Das Screenshot-Gate MUSS vor `./gradlew test` laufen. Der
      # normale test-Task dumpt die Bilder zwar nur nach
      # build/intermediates/roborazzi (die Referenzen unter
      # src/test/screenshots bleiben unberuehrt, D1 empirisch geprueft), aber
      # die Reihenfolge bleibt Sicherheitsgurt: das Gate vergleicht immer
      # gegen den eingecheckten Stand, nie gegen einen frisch erzeugten.
      #
      # D1/I-7: CaptureType explizit — verify (dieser Schritt) vergleicht nur,
      # `recordRoborazziDebug` schreibt Referenzen (nur lokal, nach Review).
      # Feature-Screens laufen im selben Gate: Rest-Konsole (Train) und
      # Now-Playing-Hero.
      - name: Screenshot-Gate (verifyRoborazziDebug fuer designsystem, workout, player)
        run: >-
          ./gradlew
          :core:designsystem:verifyRoborazziDebug
          :feature:workout:verifyRoborazziDebug
          :feature:player:verifyRoborazziDebug
          --stacktrace

      - name: Unit-Tests (./gradlew test)
        run: ./gradlew test --stacktrace

      # D3 (Entscheidung 5.4): Coverage-Gate der Kern-Module (domain:*/data:*).
      # Die Untergrenzen stehen als Ratsche im Root-Build (coverageFloors);
      # die Test-Ausfuehrung wird mit dem Unit-Test-Schritt geteilt.
      - name: Coverage-Gate (./gradlew koverVerify)
        run: ./gradlew koverVerify --stacktrace

      - name: Doku-Link-Check (tools/doku_links_check.py)
        run: python3 tools/doku_links_check.py

      # C1 (Ausbauplan): Farben gehoeren als Tokens ins Designsystem. Das Gate
      # faengt neue Hex-Literale/Color.White|Black in Features ab, bevor sie
      # sich in Screens verteilen.
      - name: Design-Gate (tools/design_check.py)
        run: python3 tools/design_check.py

      - name: Formatierung/Lint (./gradlew spotlessCheck)
        run: ./gradlew spotlessCheck --stacktrace

      # Umbauplan Phase 11: Lint und Detekt als weitere Gates. Lint-Fehler
      # blockieren den Release; Detekt-Baseline haelt Altlasten, neue
      # Code-Smells brechen den Build.
      - name: Android-Lint (./gradlew lintDebug)
        run: ./gradlew lintDebug --stacktrace

      - name: Detekt (./gradlew detekt)
        run: ./gradlew detekt

      # D2/I-5: Wachstumsbremse — die Baseline darf nicht wachsen (23
      # Eintraege). Neue Fundstellen muessen behoben werden; beim Abbau die
      # Zahl in tools/detekt_baseline_count.py mit senken.
      - name: Detekt-Baseline-Bremse (tools/detekt_baseline_count.py)
        run: python3 tools/detekt_baseline_count.py

      - name: Debug-Build (./gradlew assembleDebug)
        run: ./gradlew assembleDebug --stacktrace

      # Benchmark-Modul kompilieren UND assemblieren (früherer Fehler: fehlende
      # junit-Abhängigkeiten). `assembleBenchmarkRelease` deckt zusätzlich
      # Manifest-/Ressourcen-/Test-APK-Fehler ab, die beim reinen Kotlin-Compile
      # unsichtbar bleiben (Befund B-UI-5/Paket 1.6).
      - name: Benchmark-Modul assemblieren (./gradlew :benchmarks:assembleBenchmarkRelease)
        run: ./gradlew :benchmarks:assembleBenchmarkRelease --stacktrace

      # C1 (Ausbauplan): Screenshot-Referenzen liegen versioniert unter
      # core/designsystem/src/test/screenshots. Der Verify-Lauf steht oben
      # VOR `./gradlew test` (A7/I-1): record und verify brauchen getrennte
      # Laeufe, und der Dump-Default des test-Tasks darf nie zuerst laufen.

      # B1 (Ausbauplan): Das Baseline Profile soll eingecheckt sein — ohne
      # Datei ist die gesamte B-UI-5-Verdrahtung wirkungslos. Bis ein
      # Geraetelauf das Profil erzeugt hat (Runbook: docs/HARDWARE_TESTPLAN.md,
      # Abschnitt B1; braucht Root oder API 33+, Emulator nur mit aosp-Abbild),
      # ist dieses Gate eine Warnung statt eines Blockers, damit die CI
      # ueberhaupt Aussagekraft fuer die uebrigen Gates behaelt. Sobald die
      # Datei eingecheckt ist, zurueck auf `exit 1` stellen.
      - name: Baseline-Profil vorhanden (B1-Gate, vorlaeufig warnend)
        run: |
          PROFILE="app/src/release/generated/baselineProfiles/baseline-prof.txt"
          if [ ! -s "$PROFILE" ]; then
            echo "::warning::Baseline Profile fehlt: $PROFILE (nicht vorhanden oder leer)."
            echo "::warning::Runbook: docs/HARDWARE_TESTPLAN.md, Abschnitt B1."
            exit 0
          fi
          echo "Baseline Profile vorhanden: $(wc -l < "$PROFILE") Zeilen."

      # Der Debug-Build laeuft ohne R8. Ein Release-Build ist das einzige
      # Gate, das Minification/Shrinking prueft - genau dort entstehen
      # Fehler, die im Debug-Build unsichtbar bleiben (fehlende Keep-Regeln
      # bei Reflection auf App-Klassen, weggeschrumpfte Ressourcen). Ohne
      # signingConfig entsteht ein unsigniertes APK; fuer den
      # Regressionstest genuegt das.
      - name: Release-Build mit R8 (./gradlew assembleRelease)
        run: ./gradlew assembleRelease --stacktrace

      - name: Testberichte hochladen (bei Fehlschlag)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/tests/"
          retention-days: 7

  # C4 (Ausbauplan): Instrumentierte Tests laufen ab jetzt in der CI, aber
  # zunaechst NICHT blockierend (`continue-on-error`): der Emulator-Job soll
  # erst Vertrauen aufbauen, bevor er den Master rot faerbt. Der
  # Macrobenchmark-Lauf (B1) teilt sich denselben Emulator, braucht aber ein
  # eingechecktes Baseline-Profil und ist im Runbook dokumentiert
  # (docs/HARDWARE_TESTPLAN.md, Abschnitt B1).
  instrumented:
    name: Instrumentierte Tests (Emulator, vorlaeufig nicht blockierend)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # D6 (I-9): Wrapper-Jar gegen die offizielle Pruefsummenliste pruefen.
      - name: Gradle-Wrapper validieren
        uses: gradle/actions/wrapper-validation@v4

      - name: JDK 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: gradlew ausfuehrbar machen
        run: chmod +x ./gradlew

      - name: Gradle einrichten (Cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Benoetigte Android-SDK-Pakete sicherstellen
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort -r | head -n1)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;37.0.0" "platform-tools" "emulator" "system-images;android-33;google_apis;x86_64"

      - name: KVM fuer den Emulator freigeben
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumentierte Tests (./gradlew connectedCheck)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ./gradlew connectedCheck --stacktrace

      - name: Instrumentierte Berichte hochladen (bei Fehlschlag)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: androidtest-reports
          path: "**/build/reports/androidTests/"
          retention-days: 7
