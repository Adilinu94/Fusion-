# DropSync Detekt-Konfiguration (Umbauplan Phase 11).
# Detekt 2.0 (alpha.6): Property-Namen der neuen DSL. buildUponDefaultConfig
# = true, nur Abweichungen vom Default dokumentiert. Ziel: neue Code-Smells
# blockieren, Altlasten stehen in baseline.xml.
#
# D2 (I-5): Die Qualitaetsregeln gelten fuer PRODUKTIVCODE; Tests sind
# ausgenommen, wo sie nur Rauschen erzeugen (grosse Testklassen mit vielen
# Faellen, Fake-Sammeldateien). Die CI-Bremse
# (tools/detekt_baseline_count.py) haelt die Baseline-Anzahl fest.
complexity:
  LongMethod:
    # TrainScreen/PlaybackService sind gross, aber strukturiert; die Baseline
    # haelt den Ist-Zustand fest. Neue Methoden sollen unter dieser Grenze
    # bleiben.
    allowedLines: 120
  LongParameterList:
    active: false
  TooManyFunctions:
    active: false
  CyclomaticComplexMethod:
    allowedComplexity: 20
  NestedBlockDepth:
    allowedDepth: 6
  LargeClass:
    # D2: Testklassen sammeln bewusst viele Faelle; die Groessenregel gilt
    # dem Produktivcode.
    excludes: ['**/src/test/**', '**/src/androidTest/**']

exceptions:
  SwallowedException:
    # Bewusst aus: Der Code-Vertrag ist `catch -> AppResult.failure`
    # (domainweit). Die echte Gefahrenklasse — verschluckte
    # Coroutine-Abbrueche — sichert stattdessen der Architekturtest
    # `cancellation wird nicht verschluckt` in ModuleDependencyRulesTest,
    # der jeden `catch (e: Exception)` ohne Cancellation-Rethrow rot meldet.
    active: false
  TooGenericExceptionCaught:
    active: false

style:
  MagicNumber:
    active: false
  MaxLineLength:
    maxLineLength: 140
  ReturnCount:
    active: false
  UnusedPrivateProperty:
    # Robolectric/Compose-Preview-Platzhalter erzeugen hier Fehlalarme.
    ignoreAnnotated: ['Preview', 'Test']
  WildcardImport:
    active: false

naming:
  FunctionNaming:
    # Compose-Composables starten mit Grossbuchstaben.
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    active: false
  MatchingDeclarationName:
    # D2: Fake-/Helfer-Sammeldateien in Tests heissen nach ihrem Zweck, nicht
    # nach der ersten Deklaration; die Regel gilt dem Produktivcode.
    excludes: ['**/src/test/**', '**/src/androidTest/**']
